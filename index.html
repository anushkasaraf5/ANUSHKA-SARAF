<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anushka Saraf | Communication Design</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              cream: '#FFFFFF', // Pure White
              charcoal: '#121212', // Neutral Black (was Slate-900)
              neutral: {
                gray: '#737373', // Neutral-500
              },
              // The Strict Playful Palette - PURE PINK & PURPLE
              coral: '#FF3366',   // Vibrant Pink
              lavender: '#8B7CFF', // Soft Purple
              
              // Replacing 'stone' (warm) with 'neutral' grays to remove blue/brown tint for a True Black theme
              stone: {
                50: '#FAFAFA',
                100: '#F5F5F5',
                200: '#E5E5E5',
                300: '#D4D4D4',
                400: '#A3A3A3',
                500: '#737373',
                600: '#525252',
                700: '#404040',
                800: '#262626',
                900: '#171717',
                950: '#000000', // Pure Black
              }
            },
            fontFamily: {
              heading: ['var(--font-main-heading)', 'serif'],
              subheading: ['var(--font-sub-heading)', 'sans-serif'],
              body: ['var(--font-body-text)', 'sans-serif'],
              highlight: ['var(--font-highlight)', 'monospace'],
              sans: ['var(--font-body-text)', 'sans-serif'],
              serif: ['var(--font-main-heading)', 'serif'],
              mono: ['var(--font-highlight)', 'monospace'],
              handwriting: ['Caveat', 'cursive'],
            },
            animation: {
              'fadeIn': 'fadeIn 0.5s ease-out forwards',
              'bounce': 'bounce 2s infinite',
              'popIn': 'popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
              'float': 'float 6s ease-in-out infinite',
              'marquee': 'marquee 25s linear infinite',
              'blob': 'blob 7s infinite',
              'gradient': 'gradient 8s ease infinite',
              'shimmer': 'shimmer 1.5s infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              popIn: {
                '0%': { opacity: '0', transform: 'scale(0.5)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              marquee: {
                '0%': { transform: 'translateX(0%)' },
                '100%': { transform: 'translateX(-100%)' },
              },
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                '100%': { transform: 'translate(0px, 0px) scale(1)' },
              },
              gradient: {
                '0%': { backgroundPosition: '0% 50%' },
                '50%': { backgroundPosition: '100% 50%' },
                '100%': { backgroundPosition: '0% 50%' },
              },
              shimmer: {
                '100%': { transform: 'translateX(100%)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      /* 
       * ==========================================
       * FONT CONFIGURATION
       * Change the font families here to update the entire website.
       * ==========================================
       */
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
      
      :root {
        --font-main-heading: 'Playfair Display', serif;
        --font-sub-heading: 'Space Grotesk', sans-serif;
        --font-body-text: 'Inter', sans-serif;
        --font-highlight: 'JetBrains Mono', monospace;
      }

      body {
        font-family: 'Inter', sans-serif;
      }
      
      /* Ensure anchor links scroll to correct position accounting for sticky header */
      html {
        scroll-padding-top: 100px;
      }
      
      h1, h2, h3, h4, h5, h6 {
        letter-spacing: -0.02em;
      }

      .serif {
        font-family: 'Playfair Display', serif;
      }
      
      /* Hide scrollbar for clean modal */
      .no-scroll {
        overflow: hidden;
      }
      
      .custom-scrollbar::-webkit-scrollbar {
        width: 8px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: #FF3366; /* New Pink thumb */
        border-radius: 20px;
      }

      /* Print Styles for Resume Download */
      @media print {
        @page {
          size: A4 portrait;
          margin: 0;
        }
        
        * {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        html, body {
          width: 210mm !important;
          height: 297mm !important;
          margin: 0 !important;
          padding: 0 !important;
          overflow: hidden !important;
          background: #ffffff !important;
        }
        
        /* Hide everything else */
        body > *:not(#root) { display: none !important; }
        nav, footer, #hero, #about, #skills, #contact, #work, #custom-cursor, .fixed, #scroll-progress { 
          display: none !important; 
        }
        
        #root, main, .min-h-screen {
          margin: 0 !important;
          padding: 0 !important;
          background: transparent !important;
          height: auto !important;
          min-height: 0 !important;
        }
        
        #resume {
          display: block !important;
          position: absolute !important;
          top: 0 !important;
          left: 0 !important;
          width: 210mm !important;
          height: 297mm !important;
          margin: 0 !important;
          padding: 0 !important;
          box-sizing: border-box !important;
          page-break-after: avoid !important;
          page-break-before: avoid !important;
          page-break-inside: avoid !important;
          overflow: hidden !important;
        }

        #resume > .container {
          width: 210mm !important;
          max-width: 210mm !important;
          height: 297mm !important;
          margin: 0 !important;
          padding: 0 !important;
        }

        .resume-sheet {
          width: 210mm !important;
          height: 297mm !important;
          max-width: 210mm !important;
          max-height: 297mm !important;
          box-shadow: none !important;
          border-radius: 0 !important;
          border: none !important;
          margin: 0 !important;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@0.263.1",
    "react": "https://esm.sh/react@18.2.0",
    "react/": "https://esm.sh/react@18.2.0/",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/": "https://esm.sh/react-dom@18.2.0/",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client"
  }
}
</script>

</head>

  </body>
</html>
